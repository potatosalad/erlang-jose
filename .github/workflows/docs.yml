name: Docs

# ExDoc writes the Elixir JOSE module to JOSE.html and the Erlang jose
# module to jose.html, so docs must be built on a case-sensitive file
# system. Publish them from Linux once the release is on hex.pm.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to publish docs for
        required: true

jobs:
  publish:
    name: Publish HexDocs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.4
          otp-version: 29.1.2

      - name: Install Mix Dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Publish Docs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish docs --yes
